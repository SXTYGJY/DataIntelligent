[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modular-rag-mcp-server"
version = "0.1.0"
description = "A modular RAG (Retrieval-Augmented Generation) MCP Server for knowledge management"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["mcp", "rag", "retrieval", "llm", "knowledge-base"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pyyaml>=6.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.4.0",
    "mcp>=1.0.0,<2.0.0",  # v2 broke the v1 Tool/CallToolResult API used by this codebase
    "starlette>=0.37",     # Streamable HTTP transport (transitive via mcp, pinned explicitly)
    "uvicorn>=0.29",       # Streamable HTTP server (transitive via mcp, pinned explicitly)
    "jieba>=0.42",
    "markitdown[pdf]>=0.1.0",
    "streamlit>=1.30.0",
    "ragas>=0.1.0",
    "datasets>=2.0.0",
    "pillow>=10.0",
    "requests>=2.28",
    "httpx>=0.24",
    "openai>=1.0",
    "pymupdf>=1.23",
    # onnxruntime >= 1.24 dropped macOS x86_64 wheels (pulled in by chromadb).
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
rerank = [
    "sentence-transformers>=2.2",
]

[project.scripts]
mcp-server = "src.mcp_server.server:main"
mcp-server-http = "src.mcp_server.http_server:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.14",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pandas>=2.0",
]

[tool.uv]
# ragas 0.4.x imports `langchain_community.chat_models.vertexai`, which was
# removed in langchain-community 0.4 / langchain 1.x. Pin the langchain family
# to the 0.3.x line so the ragas import works.
constraint-dependencies = [
    "langchain<1.0",
    "langchain-core<1.0",
    "langchain-community<0.4",
    "langchain-openai<0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
    "e2e: End-to-end tests (full system tests)",
    "llm: marks tests that require real LLM API calls (deselect with '-m \"not llm\"')",
    "slow: Slow tests that should be run less frequently",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
